services:
  - type: web
    name: claude-ai-linebot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn line_bot:app --workers 2 --timeout 120
    envVars:
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LINE_USER_ID
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
